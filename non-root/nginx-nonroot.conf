# основной конфиг, запускаем полностью non-root
user appuser;
pid /home/appuser/run/nginx.pid;

worker_processes 1;

events { worker_connections 1024; }

http {
    server {
        listen 8080;

        root /usr/share/nginx/html;
        index index.html;

        location / {
            try_files $uri /index.html;
        }

        client_body_temp_path /home/appuser/cache/client_temp;
        proxy_temp_path       /home/appuser/cache/proxy_temp;
        fastcgi_temp_path     /home/appuser/cache/fastcgi_temp;
        uwsgi_temp_path       /home/appuser/cache/uwsgi_temp;
        scgi_temp_path        /home/appuser/cache/scgi_temp;
    }
}

